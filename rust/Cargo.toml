[package]
name = "goatcord-core"
version = "0.1.0"
edition = "2021"
description = "GoatCord — core portado para Rust (TOTP, cripto, validação/armazenamento de tokens). Sem coleta de credenciais e sem automação self-bot."
license = "SEE LICENSE IN ../LICENSE"

# Biblioteca (reutilizável por um futuro app Tauri) + binário CLI de demonstração.
[lib]
name = "goatcord_core"
path = "src/lib.rs"

[[bin]]
name = "goatcord"
path = "src/main.rs"

[dependencies]
# TOTP / HMAC
hmac = "0.12.1"
sha1 = "0.10.6"
# Cripto simétrica compatível com o crypto.js (AES-256-GCM + scrypt)
aes-gcm = "0.10.3"
scrypt = "0.11.0"
# Utilidades
base64 = "0.22.1"
rand = "0.8.5"
# HTTP (validação de token na API do Discord)
reqwest = { version = "0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Serialização / armazenamento
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
# CLI e caminhos de dados
clap = { version = "4.5.27", features = ["derive"] }
dirs = "5.0.1"
anyhow = "1.0.95"
