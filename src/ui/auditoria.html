<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/ui/assets/disclaw_icon.svg" />
<title>Auditoria — Painel Disclaw</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #161a22; --panel2: #1d222c; --border: #2a313d;
    --txt: #e6e9ef; --muted: #8a93a6; --accent: #6ea8fe;
    --red: #ff6b6b; --amber: #ffc14d; --green: #5fd28a; --blue: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  a.voltar { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.voltar:hover { text-decoration: underline; }
  .controls {
    padding: 14px 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  select, input, button {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none;
  }
  input { min-width: 220px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .wrap { padding: 0 22px 40px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td {
    text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top; font-size: 13px;
  }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  tbody tr:hover { background: var(--panel); }
  td.ts { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  td.ua { color: var(--muted); max-width: 360px; overflow-wrap: anywhere; }
  td.email { overflow-wrap: anywhere; max-width: 220px; }
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
    font-weight: 600; white-space: nowrap;
  }
  .b-falha    { background: rgba(255,107,107,.14); color: var(--red); }
  .b-bloqueio { background: rgba(255,193,77,.14);  color: var(--amber); }
  .b-sucesso  { background: rgba(95,210,138,.14);  color: var(--green); }
  .b-admin    { background: rgba(110,168,254,.14); color: var(--blue); }
  .b-outro    { background: rgba(138,147,166,.14); color: var(--muted); }
  .estado { padding: 50px 22px; text-align: center; color: var(--muted); }
  .estado a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Auditoria de acesso</h1>
      <div class="sub">Tentativas de login e acessos ao super-admin · últimas 500 entradas</div>
    </div>
    <div class="spacer"></div>
    <a class="voltar" href="/">← Voltar ao painel</a>
  </header>

  <div class="controls">
    <select id="filtroEvento">
      <option value="">Todos os eventos</option>
      <option value="login.falha">Login: falha</option>
      <option value="login.bloqueado">Login: bloqueado</option>
      <option value="login.sucesso">Login: sucesso</option>
      <option value="all-tokens">Super-admin (all-tokens)</option>
    </select>
    <input id="busca" type="text" placeholder="Filtrar por IP, e-mail ou texto…" />
    <button id="recarregar">↻ Recarregar</button>
    <span class="count" id="contador"></span>
  </div>

  <div class="wrap">
    <div id="estado" class="estado">Carregando…</div>
    <table id="tabela" style="display:none">
      <thead>
        <tr><th>Data/Hora</th><th>Evento</th><th>E-mail tentado</th><th>IP</th><th>Navegador (UA)</th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>

<script>
  let TODAS = [];

  function badgeClasse(ev) {
    if (ev === 'login.falha') return 'b-falha';
    if (ev === 'login.bloqueado') return 'b-bloqueio';
    if (ev === 'login.sucesso') return 'b-sucesso';
    if (ev && ev.startsWith('all-tokens')) return 'b-admin';
    return 'b-outro';
  }

  function fmtData(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || '';
    return d.toLocaleString('pt-BR', { hour12: false });
  }

  // Monta a tabela usando textContent (NUNCA innerHTML) — email/UA são
  // controlados por quem faz a requisição; evita XSS armazenado no painel admin.
  function render() {
    const ev = document.getElementById('filtroEvento').value;
    const q = document.getElementById('busca').value.trim().toLowerCase();
    const corpo = document.getElementById('corpo');
    corpo.textContent = '';

    const itens = TODAS.filter((e) => {
      if (ev && !(e.evento === ev || (ev === 'all-tokens' && String(e.evento).startsWith('all-tokens')))) return false;
      if (q) {
        const hay = [e.evento, e.email, e.ip, e.ua].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    for (const e of itens) {
      const tr = document.createElement('tr');

      const tdTs = document.createElement('td');
      tdTs.className = 'ts'; tdTs.textContent = fmtData(e.ts);

      const tdEv = document.createElement('td');
      const span = document.createElement('span');
      span.className = 'badge ' + badgeClasse(e.evento);
      span.textContent = e.evento || '—';
      tdEv.appendChild(span);

      const tdEmail = document.createElement('td');
      tdEmail.className = 'email'; tdEmail.textContent = e.email || '—';

      const tdIp = document.createElement('td');
      tdIp.className = 'ip'; tdIp.textContent = e.ip || '—';

      const tdUa = document.createElement('td');
      tdUa.className = 'ua'; tdUa.textContent = e.ua || '—';

      tr.append(tdTs, tdEv, tdEmail, tdIp, tdUa);
      corpo.appendChild(tr);
    }

    document.getElementById('contador').textContent =
      itens.length + ' de ' + TODAS.length + ' entradas';
  }

  async function carregar() {
    const estado = document.getElementById('estado');
    const tabela = document.getElementById('tabela');
    estado.style.display = ''; tabela.style.display = 'none';
    estado.textContent = 'Carregando…';
    try {
      const res = await fetch('/api/admin/auditoria', { credentials: 'include' });
      if (res.status === 401) {
        estado.innerHTML = 'Você precisa estar logado como super-admin. <a href="/">Ir para o login →</a>';
        return;
      }
      if (res.status === 403) {
        estado.innerHTML = 'Acesso restrito ao super-admin. <a href="/">Voltar ao painel →</a>';
        return;
      }
      if (!res.ok) { estado.textContent = 'Erro ao carregar (HTTP ' + res.status + ').'; return; }
      const data = await res.json();
      TODAS = Array.isArray(data.entradas) ? data.entradas : [];
      if (TODAS.length === 0) {
        estado.textContent = 'Nenhum registro de auditoria ainda.';
        return;
      }
      estado.style.display = 'none'; tabela.style.display = '';
      render();
    } catch (e) {
      estado.textContent = 'Falha de rede ao carregar a auditoria.';
    }
  }

  document.getElementById('filtroEvento').addEventListener('change', render);
  document.getElementById('busca').addEventListener('input', render);
  document.getElementById('recarregar').addEventListener('click', carregar);
  carregar();
</script>
</body>
</html>
